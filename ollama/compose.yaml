name: dev-ollama

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.32.5}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  ollama_data:
