name: dev-xxl-job

services:
  mysql:
    image: mysql:${XXL_JOB_MYSQL_VERSION:-8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${XXL_JOB_MYSQL_PASSWORD:-dev_xxl_job_mysql}
      MYSQL_DATABASE: xxl_job
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - xxl_job_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:${XXL_JOB_VERSION:-3.4.0}
    # 上游 3.4.0 镜像仅提供 amd64；Apple Silicon 由 Docker Desktop 模拟运行。
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${XXL_JOB_PORT:-8083}:8080"
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${XXL_JOB_MYSQL_PASSWORD:-dev_xxl_job_mysql}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-dev_xxl_job_token}
        --server.servlet.context-path=/xxl-job-admin
      JAVA_OPTS: ${XXL_JOB_JAVA_OPTS:--Xms256m -Xmx512m}
    volumes:
      - xxl_job_logs:/data/applogs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/xxl-job-admin/auth/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      # Apple Silicon 上通过 amd64 模拟启动会更慢。
      start_period: 60s

volumes:
  xxl_job_mysql_data:
  xxl_job_logs:
