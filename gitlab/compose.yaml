name: dev-gitlab

services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION:-19.2.1-ce.0}
    restart: unless-stopped
    hostname: ${GITLAB_HOSTNAME:-gitlab.localhost}
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${GITLAB_HOSTNAME:-gitlab.localhost}:${GITLAB_HTTP_PORT:-8929}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2224}
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD:-dev_gitlab_root_password}'
        letsencrypt['enable'] = false
        prometheus_monitoring['enable'] = false
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 10
    ports:
      - "127.0.0.1:${GITLAB_HTTP_PORT:-8929}:${GITLAB_HTTP_PORT:-8929}"
      - "127.0.0.1:${GITLAB_SSH_PORT:-2224}:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: 256m
    networks: [dev-backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${GITLAB_HTTP_PORT:-8929}/-/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 5m

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:

networks:
  dev-backend:
    external: true
    name: dev-backend
