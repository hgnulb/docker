# Apollo 本地快速体验环境：独立 MySQL + Portal/Config/Admin 三个进程。
# 数据库不复用根目录 mysql 模块，避免 Apollo 表结构污染业务库。
name: dev-apollo

services:
  apollo-db:
    image: mysql:${APOLLO_MYSQL_VERSION:-8.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APOLLO_MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${APOLLO_MYSQL_PASSWORD:-dev_apollo_mysql}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - apollo_mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  apollo:
    image: ${APOLLO_IMAGE:-nobodyiam/apollo-quick-start:2.5.0}
    restart: unless-stopped
    depends_on:
      apollo-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APOLLO_PORTAL_PORT:-8070}:8070"
      # Config Service 保持宿主机/容器端口一致，Apollo 客户端发现地址才能直接访问。
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:${APOLLO_ADMIN_PORT:-8090}:8090"
    environment:
      APOLLO_CONFIG_DB_USERNAME: root
      APOLLO_CONFIG_DB_PASSWORD: ${APOLLO_MYSQL_PASSWORD:-dev_apollo_mysql}
      APOLLO_PORTAL_DB_USERNAME: root
      APOLLO_PORTAL_DB_PASSWORD: ${APOLLO_MYSQL_PASSWORD:-dev_apollo_mysql}
      JAVA_OPTS: ${APOLLO_JAVA_OPTS:--Xms256m -Xmx768m -Xmn128m}
    volumes:
      - apollo_logs:/opt/logs
    healthcheck:
      # Quick Start 镜像内同时运行 Portal、Config Service 和 Admin Service。
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:8070/signin >/dev/null &&
          curl -fsS http://127.0.0.1:8080/health >/dev/null &&
          curl -fsS http://127.0.0.1:8090/health >/dev/null
      interval: 10s
      timeout: 8s
      retries: 24
      start_period: 60s

volumes:
  apollo_mysql_data:
  apollo_logs:
