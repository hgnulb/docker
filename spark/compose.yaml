name: dev-spark

x-spark-common: &spark-common
  image: apache/spark:${SPARK_VERSION:-4.1.2-scala2.13-java17-python3-ubuntu}
  restart: unless-stopped
  networks: [dev-backend]

services:
  spark-master:
    <<: *spark-common
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "127.0.0.1:${SPARK_MASTER_PORT:-17077}:7077"
      - "127.0.0.1:${SPARK_MASTER_UI_PORT:-18082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  spark-worker:
    <<: *spark-common
    depends_on:
      spark-master:
        condition: service_healthy
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - --cores
      - ${SPARK_WORKER_CORES:-2}
      - --memory
      - ${SPARK_WORKER_MEMORY:-2g}
      - spark://spark-master:7077
    ports:
      - "127.0.0.1:${SPARK_WORKER_UI_PORT:-18083}:8081"
    volumes:
      - spark_work:/opt/spark/work

volumes:
  spark_work:

networks:
  dev-backend:
    external: true
    name: dev-backend
