name: dev-sonarqube

services:
  sonarqube:
    image: sonarqube:${SONARQUBE_VERSION:-26.8.0.126808-community}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SONARQUBE_PORT:-19001}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:-dev_sonarqube_postgres}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks: [default, dev-backend]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-proxy --quiet -O /dev/null http://127.0.0.1:9000/api/system/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  postgres:
    image: postgres:${SONARQUBE_POSTGRES_VERSION:-17}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-dev_sonarqube_postgres}
    volumes:
      - sonarqube_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_postgres_data:

networks:
  dev-backend:
    external: true
    name: dev-backend
