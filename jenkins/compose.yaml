name: dev-jenkins

services:
  jenkins:
    image: jenkins/jenkins:${JENKINS_VERSION:-2.568.1-jdk21}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JENKINS_HTTP_PORT:-8084}:8080"
      - "127.0.0.1:${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      JAVA_OPTS: >-
        -Duser.timezone=${JENKINS_TIMEZONE:-Asia/Shanghai}
        -Djenkins.install.runSetupWizard=true
    volumes:
      - jenkins_home:/var/jenkins_home
    networks: [dev-backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  jenkins_home:

networks:
  dev-backend:
    external: true
    name: dev-backend
