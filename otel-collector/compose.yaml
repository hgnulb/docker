name: dev-otel-collector

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_VERSION:-0.158.0}
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_PROMETHEUS_PORT:-9464}:9464"
    volumes:
      - ./config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [dev-backend]
    healthcheck:
      # 官方精简镜像没有 curl；这里校验挂载配置，真实链路用 /targets 和后端 ready 接口确认。
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  dev-backend:
    external: true
    name: dev-backend
