name: dev-nacos

services:
  nacos:
    image: nacos/nacos-server:${NACOS_VERSION:-v3.2.3}
    restart: unless-stopped
    ports:
      # 控制台改用 18000，避免与 Apollo Config Service 的 8080 冲突。
      - "127.0.0.1:${NACOS_CONSOLE_PORT:-18000}:8080"
      - "127.0.0.1:${NACOS_SERVER_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT:-9848}:9848"
    environment:
      # standalone + 内置数据库仅适合本地开发；生产环境应使用集群和外部数据库。
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-VGhpc0lzQURldk9ubHlUb2tlblRoYXRNdXN0QmVDaGFuZ2Vk}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-devIdentityKey}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-devIdentityValue}
      JVM_XMS: ${NACOS_JVM_XMS:-512m}
      JVM_XMX: ${NACOS_JVM_XMX:-512m}
      JVM_XMN: ${NACOS_JVM_XMN:-256m}
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    healthcheck:
      # Nacos 3.x 使用 v3 Admin API；旧 v1 Console 路径会返回 404。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  nacos_data:
  nacos_logs:
