name: dev-qdrant

services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.18.2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev_qdrant_key}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # 官方镜像没有 curl/wget，使用镜像自带 Bash 发起最小 HTTP 请求。
      test:
        - CMD
        - /usr/bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /readyz HTTP/1.0\r\napi-key: %s\r\n\r\n' "$${QDRANT__SERVICE__API_KEY}" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  qdrant_data:
