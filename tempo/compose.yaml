name: dev-tempo

services:
  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.10.5}
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:${TEMPO_HTTP_PORT:-3200}:3200"
      - "127.0.0.1:${TEMPO_OTLP_GRPC_PORT:-14317}:4317"
      - "127.0.0.1:${TEMPO_OTLP_HTTP_PORT:-14318}:4318"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks: [dev-backend]

volumes:
  tempo_data:

networks:
  dev-backend:
    external: true
    name: dev-backend
