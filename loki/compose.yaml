name: dev-loki

services:
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.2}
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [dev-backend]

volumes:
  loki_data:

networks:
  dev-backend:
    external: true
    name: dev-backend
